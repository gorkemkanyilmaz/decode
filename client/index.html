<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>DECODED — 3D Number Hunt</title>
    <meta
      name="description"
      content="Fast-paced 3D stealth multiplayer party game. Read opponents' forehead numbers and decode them before they decode yours!"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Root -->
    <div id="ui-root"></div>

    <!-- Mobile Virtual Joystick Containers -->
    <div id="touch-controls" class="touch-controls hidden">
      <div id="joystick-move-zone" class="touch-zone move-zone">
        <div id="joystick-move-base" class="joystick-base">
          <div id="joystick-move-thumb" class="joystick-thumb"></div>
        </div>
      </div>
      <div id="touch-look-zone" class="touch-zone look-zone">
        <div class="touch-hint">Drag to Look</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
